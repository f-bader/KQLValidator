name: zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Workflow security
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SARIF upload needs GitHub Advanced Security on private repositories; checked at
      # runtime because scheduled runs have no repository event payload.
      - name: Determine repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"
      - name: Upload workflow security findings
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github
          version: v1.29.0
          persona: regular
          min-severity: medium
          min-confidence: high
          # Findings land in the Security tab once the repository is public.
          advanced-security: ${{ steps.visibility.outputs.private == 'false' }}
      # SARIF mode reports findings with exit code zero. Run the blocking scan
      # after upload so findings remain visible when this check fails.
      - name: Enforce medium, high-confidence findings
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github
          version: v1.29.0
          persona: regular
          min-severity: medium
          min-confidence: high
          advanced-security: false
          annotations: true
