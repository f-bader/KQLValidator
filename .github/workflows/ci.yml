name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Locked restore
        run: dotnet restore kql-validator.slnx --locked-mode
      - name: Format
        run: dotnet format kql-validator.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build kql-validator.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/KqlValidator.Tests/KqlValidator.Tests.csproj --configuration Release --no-build --no-restore
      - name: Dependency audit
        run: |
          dotnet list kql-validator.slnx package --vulnerable --include-transitive --format json --output-version 1 --no-restore > vulnerabilities.json
          jq --exit-status '[.. | objects | .vulnerabilities? // empty] | flatten | length == 0' vulnerabilities.json >/dev/null
      - name: Publish
        run: dotnet publish src/KqlValidator.Api/KqlValidator.Api.csproj --configuration Release --no-restore --output artifacts/publish /p:UseAppHost=false
      - name: Verify status site build switch
        run: bash scripts/validate-status-site-build.sh
      - name: Build container
        run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} --tag kql-validator:${{ github.sha }} .
      - name: Scan container
        uses: anchore/scan-action@f6601287cdb1efc985d6b765bbf99cb4c0ac29d8 # v7.0.0
        with:
          image: kql-validator:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
      - uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2
        with:
          inlineScript: |
            az bicep build --file infra/main.bicep --outfile /tmp/main.json
            az bicep build --file infra/budget.bicep --outfile /tmp/budget.json
