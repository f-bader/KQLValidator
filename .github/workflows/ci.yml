name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Locked restore
        run: dotnet restore kql-validator.slnx --locked-mode
      - name: Format
        run: dotnet format kql-validator.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build kql-validator.slnx --configuration Release --no-restore
      - name: Test
        timeout-minutes: 5
        run: >-
          dotnet test tests/KqlValidator.Tests/KqlValidator.Tests.csproj
          --configuration Release --no-build --no-restore
          --timeout 3m --long-running 15 --output Detailed
      - name: Test mocked NRT response handling
        shell: pwsh
        run: ./scripts/Test-NrtProbe.ps1
      - name: Dependency audit
        run: |
          dotnet list kql-validator.slnx package --vulnerable --include-transitive --format json --output-version 1 --no-restore > vulnerabilities.json
          jq --exit-status '[.. | objects | .vulnerabilities? // empty] | flatten | length == 0' vulnerabilities.json >/dev/null
      - name: Publish
        run: dotnet publish src/KqlValidator.Api/KqlValidator.Api.csproj --configuration Release --no-restore --output artifacts/publish /p:UseAppHost=false
      - name: Verify status site build switch
        run: bash scripts/validate-status-site-build.sh
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release_number='(0|[1-9][0-9]*)'
            prerelease_identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
            release_pattern="^${release_number}\\.${release_number}\\.${release_number}(-${prerelease_identifier}(\\.${prerelease_identifier})*)?$"
            if [[ ! "$version" =~ $release_pattern || ${#version} -gt 100 ]]; then
              echo 'Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix.' >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build container
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg VERSION="$VERSION" --tag "kql-validator:$GITHUB_SHA" .
      - name: Scan container
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kql-validator:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Smoke-test container
        run: |
          docker run --detach --name kql-validator-smoke --publish 127.0.0.1:8080:8080 "kql-validator:$GITHUB_SHA"
          trap 'docker logs kql-validator-smoke; docker rm --force kql-validator-smoke' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors \
            --max-time 5 --retry-max-time 90 http://127.0.0.1:8080/health/ready
          ./scripts/smoke-test.sh http://127.0.0.1:8080
      - uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            az bicep build --file infra/main.bicep --outfile /tmp/main.json
            az bicep build --file infra/foundation.bicep --outfile /tmp/foundation.json
            az bicep build --file infra/budget.bicep --outfile /tmp/budget.json
      - name: Export release container
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: docker save "kql-validator:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/kql-validator.tar.gz"
      - name: Upload release container
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-container
          path: ${{ runner.temp }}/kql-validator.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    if: github.repository == 'f-bader/KQLValidator' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download validated container
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-container
          path: ${{ runner.temp }}/release-container
      - name: Load validated container
        run: docker load --input "$RUNNER_TEMP/release-container/kql-validator.tar.gz"
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/f-bader/kql-validator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=sha,format=long
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated container
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag "kql-validator:$GITHUB_SHA" "$tag"
            docker push "$tag"
            echo "Published \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: azure-lab-deployment
      cancel-in-progress: false
    environment:
      name: lab
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tenant, subscription, and client IDs live in secrets so they are masked in the
      # public workflow logs instead of enumerating the Azure footprint for every reader.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build, deploy, and smoke-test Azure lab
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          CUSTOM_SCHEMA_PATH: ${{ vars.CUSTOM_SCHEMA_PATH }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
          AZURE_CUSTOM_DOMAIN: ${{ vars.AZURE_CUSTOM_DOMAIN }}
          AZURE_MANAGED_CERTIFICATE_NAME: ${{ vars.AZURE_MANAGED_CERTIFICATE_NAME }}
        run: ./scripts/deploy-lab.sh
