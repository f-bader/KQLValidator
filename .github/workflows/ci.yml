name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Locked restore
        run: dotnet restore kql-validator.slnx --locked-mode
      - name: Format
        run: dotnet format kql-validator.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build kql-validator.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/KqlValidator.Tests/KqlValidator.Tests.csproj --configuration Release --no-build --no-restore
      - name: Dependency audit
        run: |
          dotnet list kql-validator.slnx package --vulnerable --include-transitive --format json --output-version 1 --no-restore > vulnerabilities.json
          jq --exit-status '[.. | objects | .vulnerabilities? // empty] | flatten | length == 0' vulnerabilities.json >/dev/null
      - name: Publish
        run: dotnet publish src/KqlValidator.Api/KqlValidator.Api.csproj --configuration Release --no-restore --output artifacts/publish /p:UseAppHost=false
      - name: Verify status site build switch
        run: bash scripts/validate-status-site-build.sh
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build container
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} --build-arg VERSION="$VERSION" --tag kql-validator:${{ github.sha }} .
      - name: Scan container
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: kql-validator:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
      - uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            az bicep build --file infra/main.bicep --outfile /tmp/main.json
            az bicep build --file infra/budget.bicep --outfile /tmp/budget.json

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: azure-lab-deployment
      cancel-in-progress: false
    environment:
      name: lab
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tenant, subscription, and client IDs live in secrets so they are masked in the
      # public workflow logs instead of enumerating the Azure footprint for every reader.
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build, deploy, and smoke-test Azure lab
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_RESOURCE_GROUP: ${{ vars.AZURE_ACR_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
        run: ./scripts/deploy-lab.sh
