name: schema-sync

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    # The daily cron must not fire on forks.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'f-bader/KQLValidator'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - run: dotnet restore tools/KqlValidator.SchemaSync/KqlValidator.SchemaSync.csproj --locked-mode
      - run: dotnet run --project tools/KqlValidator.SchemaSync --no-restore -- --out src/KqlValidator.Api/Schemas
      - name: Reject workspace-specific custom tables
        run: |
          if jq -r '(.tables // .)[].name' src/KqlValidator.Api/Schemas/sentinel.json | grep -Eiq '_CL?$'; then
            echo "sentinel.json contains _CL/_C custom tables; refusing to publish workspace-specific schema." >&2
            exit 1
          fi
      - run: dotnet test tests/KqlValidator.Tests/KqlValidator.Tests.csproj
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/schema-update
          delete-branch: true
          commit-message: 'chore: update KQL schema snapshots'
          title: 'chore: update KQL schema snapshots'
          body: |
            Automated schema review PR. Source digests are recorded in `Schemas/manifest.json`.
            Large table drops, duplicate tables, and duplicate columns are rejected before this PR is opened.
